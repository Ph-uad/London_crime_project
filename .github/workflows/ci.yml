name: CI

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

jobs:
  web:
    name: Lint and build the web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Installed from the repository root, not from web/. The lockfile lives
      # at the root because the root package.json declares `workspaces: [web]`,
      # so `npm ci` inside web/ fails with EUSAGE — there is no lockfile there.
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspace web

      - name: Type-check
        run: npm run typecheck --workspace web

      # Route tests for /api/metrics, /api/meta and /api/geo. They import the
      # handlers directly and call them with Request objects, so no server and no
      # network are needed. They read the real data/processed exports, which also
      # makes them a contract check on the pipeline's output.
      - name: Run route tests
        run: npm run test --workspace web

      - name: Build the app
        run: npm run build --workspace web

  e2e:
    name: Browser and accessibility checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # 81 checks against the real production build. They render every route and
      # four dashboard states at 375/768/1280px and run axe at each, which is
      # how issues 3.1 and 3.8 state their measurable criteria — no horizontal
      # overflow, reachable navigation, 44px touch targets, zero WCAG 2.1 AA
      # violations — as checks rather than claims. The dashboard suite also
      # asserts the things this dataset makes easy to get wrong: a 32-borough
      # metric drawn as if it had 33, a colour ramp that runs the same way for
      # `higher_is_worse` and `higher_is_better`, a rank denominator of 33 where
      # the source says 32, and a trend fitted across a partial year.
      - name: Run browser checks
        run: npm run e2e --workspace web

      # The report is the summary; test-results holds the traces the config
      # records on the first retry. A trace is the only way to diagnose a
      # failure that happens on a runner and not on a developer's machine —
      # without one, the log says an assertion failed and nothing about why.
      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  pipeline:
    name: Check the R pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install R and pipeline dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-data.table r-cran-jsonlite

      # Catches syntax errors only. It does NOT catch a call to an undefined
      # function or a use of an undefined object — `tr(...)` parses fine — so
      # the smoke test below is the check that actually matters.
      - name: Parse every script
        run: |
          set -e
          for f in $(find pipeline -name '*.R' | sort); do
            Rscript -e "invisible(parse('$f'))" && echo "ok   $f"
          done

      # Runs the whole pipeline against synthetic fixtures built in a temp
      # directory, then deliberately breaks two things and asserts the guards
      # fire. No raw data required, so it runs on every PR.
      - name: Smoke test the pipeline
        run: Rscript pipeline/tests/smoke.R
